characters:
  age_range: [20, 45]        # 登場人物のメインの年齢層
  children_age_range: [2, 10]
  nationality: 日本人
  look: 普通の服装・自然なメイク（モデル風にしすぎない）

setting:
  country: 日本
  locations: [2LDKマンション, アパートのワンルーム, コンビニ, ファミレス, オフィス, 保育園の送迎時]
  details: [畳かフローリング, 日本の家電, コンビニのレジ袋, 通勤電車, 日本語の看板]
  season_aware: true         # 投稿日の季節に合わせる

format:
  aspect_ratio: "9:16"
  cuts: [3, 4]
  duration_sec: [30, 60]
  title_bar: { background: black, text_color: "#FFD400", position: top }
  subtitles: { language: ja, position: bottom, max_chars_per_line: 16 }

prohibited:
  - 実在の人物・有名人・企業・商品名
  - 暴力・性的な表現・差別的な表現
  - 未成年をネタにした過激な描写
  - 特定の職業・地域をバカにする内容
  - 政治・宗教
  - 医療や法律について誤解を招く内容
